name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Shared evaluation harness. Pin to a tag once it is released; @main
      # means a breaking change there fails this build, which is the point.
      - name: Install shared harness
        run: pip install "eval-harness @ git+https://github.com/mukundjaiswal/eval-harness.git@main"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing

  # Not yet enabled: run the evaluation suite against a committed dataset and
  # gate on eval-harness's regression check. See docs/evaluation.md.
